<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXORA</title>
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <header >
   <h2 data-aos="fade-right" data-aos-duration="500" data-aos-delay="50">NEXORA</h2>
    <a href="index.html" data-aos="fade-right" data-aos-duration="600" data-aos-delay="10">Home</a>
    <a href="projects.html" data-aos="fade-right" data-aos-duration="700" data-aos-delay="20">Projects</a>
    <a href="service.html" data-aos="fade-right" data-aos-duration="800" data-aos-delay="30">Service</a>
    <a href="about.html" data-aos="fade-right" data-aos-duration="900" data-aos-delay="40">About</a>
    <a href="contact.html" data-aos="fade-right" data-aos-duration="1000" data-aos-delay="50">Contact</a>
    <div>
        <a href="contact.html">
    <button data-aos="fade-right" data-aos-duration="1500" data-aos-delay="500">Start a project</button>
</a>
</div>
   </header>
   
<main class="Contact">
  <div class="lets">
    <div>
    <h1 data-aos="zoom-in" data-aos-duration="500" data-aos-delay="200">LET'S MAKE<br> SOMETHING GREAT</h1>
    <p data-aos="fade-up" data-aos-duration="400" data-aos-delay="100">Have an idea? Tell us about it.</p>
    <h2 data-aos="zoom-in" data-aos-duration="500" data-aos-delay="200">Email</h2>
    <p data-aos="fade-up" data-aos-duration="400" data-aos-delay="100">hello@nexora.com</p>
    <h2 data-aos="zoom-in" data-aos-duration="500" data-aos-delay="200">Phone</h2>
    <p data-aos="fade-up" data-aos-duration="400" data-aos-delay="100">+992 XX XXX XXXX</p>
    <h2 data-aos="zoom-in" data-aos-duration="500" data-aos-delay="200">Address</h2>
    <p data-aos="fade-up" data-aos-duration="400" data-aos-delay="100">Dushanbe, Tajikistan</p>
  </div>
  </div>
  <div class="send">
    <div >
        <form>
      <input type="text" id="name" placeholder="Name" data-aos="fade-right" data-aos-duration="500" data-aos-delay="200" required>
       <input type="email" id="email" placeholder="Email" data-aos="fade-right" data-aos-duration="600" data-aos-delay="300" required><br>
       <input type="text" id="company" placeholder="Company"  data-aos="fade-right" data-aos-duration="700" data-aos-delay="400" required><br>
       <select id="project"  data-aos="fade-right" data-aos-duration="800" data-aos-delay="400" required>
        <option >Project type</option>
       </select>
       <select id="budget" data-aos="fade-right" data-aos-duration="900" data-aos-delay="400" required>
        <option >Budget</option > 
       </select><br>
       <textarea id="message" rows="8" cols="67" placeholder="Message" data-aos="fade-right" data-aos-duration="900" data-aos-delay="400"></textarea><br>
       <input type="submit" id="submit" value="Send message" data-aos="fade-right" data-aos-duration="900" data-aos-delay="500">
            </form>
    </div>
  </div>
</main>

       <script src="https://unpkg.com/aos@2.3.1/dist/aos.js">

 </script>
 <script>
    AOS.init(
        once=true
    );
 </script>
</body>
</html>
